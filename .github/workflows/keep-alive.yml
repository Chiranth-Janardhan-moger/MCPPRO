name: keep-alive-ping

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum interval
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render FastAPI & MCP services
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://mcppro.onrender.com' }}
        run: |
          TARGET="${BACKEND_URL%/}"
          echo "Pinging FastAPI Health at ${TARGET}/health..."
          curl -fsS -o /dev/null -w "Health HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            "${TARGET}/health" || true

          echo "Pinging FastMCP status at ${TARGET}/api/v1/mcp-status..."
          curl -fsS -o /dev/null -w "MCP HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            "${TARGET}/api/v1/mcp-status" || true

name: keep-alive-ping

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum interval
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render service
        run: |
          curl -fsS -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 --retry 4 --retry-delay 15 --retry-all-errors \
            https://mcppro.onrender.com/

version: '3.8'

services:
  mcppro-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcppro-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
    volumes:
      - backend_results:/app/results
      - backend_vector_store_cache:/app/vector_store_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcppro-network

  mcppro-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcppro-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://mcppro-backend:8000
    depends_on:
      mcppro-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcppro-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: mcppro-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcppro-network

networks:
  mcppro-network:
    driver: bridge

volumes:
  backend_results:
  backend_vector_store_cache:
  qdrant_data:
